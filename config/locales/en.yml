# La aplicación está en español. Se usa el locale por defecto (:en) y aquí se
# sobrescriben sus mensajes y nombres de atributos con textos en español.
en:
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "no puede estar vacío"
      present: "debe estar vacío"
      taken: "ya está registrado"
      invalid: "no es válido"
      inclusion: "no es una opción válida"
      exclusion: "está reservado"
      required: "debe existir"
      too_long: "es demasiado largo (máximo %{count} caracteres)"
      too_short: "es demasiado corto (mínimo %{count} caracteres)"
      wrong_length: "debe tener %{count} caracteres"
      confirmation: "no coincide con %{attribute}"
      not_a_number: "no es un número"
      password_too_long: "es demasiado larga"
  activerecord:
    errors:
      messages:
        required: "debe existir"
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_one: "No se puede eliminar porque tiene %{record} asociado"
          has_many: "No se puede eliminar porque tiene %{record} asociados"
    models:
      province: { one: "Provincia", other: "Provincias" }
      city: { one: "Ciudad", other: "Ciudades" }
      appliance_type: { one: "Electrodoméstico", other: "Electrodomésticos" }
      company: { one: "Empresa", other: "Empresas" }
      user: { one: "Usuario", other: "Usuarios" }
    attributes:
      province:
        nombre: "Nombre"
        cities: "ciudades"
      city:
        nombre: "Nombre"
        province: "Provincia"
        province_id: "Provincia"
        companies: "empresas"
      appliance_type:
        nombre: "Nombre"
        activo: "Activo"
        company_appliance_types: "empresas asociadas"
      company:
        nombre: "Nombre"
        ruc: "RUC"
        descripcion: "Descripción"
        telefono: "Teléfono"
        direccion: "Dirección"
        city: "Ciudad"
        city_id: "Ciudad"
        status: "Estado"
        appliance_types: "Electrodomésticos"
        users: "usuarios"
      user:
        username: "Usuario"
        nombre_completo: "Nombre completo"
        cedula: "Cédula"
        role: "Rol"
        company: "Empresa"
        company_id: "Empresa"
        activo: "Activo"
        password: "Contraseña"
        password_confirmation: "Confirmación de contraseña"
